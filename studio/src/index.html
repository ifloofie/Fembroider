<title>Stitch Studio</title>
<style>
/* Layout: slicer-style workbench. A navy header carries the Design / Stitch / Export stages; the 3D build plate fills the
   rest, with floating panels: tools on the left, the stage's settings on the right, the export summary bottom-right. */
:root {
  --bg: #e9edf2;
  --panel: #ffffff;
  --panel-2: #f4f6f9;
  --ink: #18202b;
  --muted: #5b6576;
  --faint: #8a93a3;
  --line: #d7dde6;
  --line-strong: #c3cbd7;
  --primary: #196ef0;
  --primary-ink: #ffffff;
  --primary-soft: #e3edfd;
  --good: #1d7a46;
  --warn: #b86a00;
  --bad: #c42b36;
  --header: #0e1c3f;
  --header-2: #16306a;
  --header-ink: #ffffff;
  --shadow: 0 6px 22px rgba(18, 32, 58, .14), 0 1px 3px rgba(18, 32, 58, .10);
  --scene-top: #f1f4f8;
  --scene-bottom: #d3dae4;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --font-brand: "Saira Extra Condensed", "Arial Narrow", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181e; --panel: #23272f; --panel-2: #1c2027; --ink: #e8ebf0; --muted: #a3acba; --faint: #7d8696;
    --line: #353b46; --line-strong: #454c59; --primary: #4a8dff; --primary-ink: #ffffff; --primary-soft: #1f3253;
    --good: #4cc38a; --warn: #f0a63c; --bad: #ff6b74; --header: #0b1430; --header-2: #132555;
    --shadow: 0 6px 22px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
    --scene-top: #2a2f38; --scene-bottom: #15181d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181e; --panel: #23272f; --panel-2: #1c2027; --ink: #e8ebf0; --muted: #a3acba; --faint: #7d8696;
  --line: #353b46; --line-strong: #454c59; --primary: #4a8dff; --primary-ink: #ffffff; --primary-soft: #1f3253;
  --good: #4cc38a; --warn: #f0a63c; --bad: #ff6b74; --header: #0b1430; --header-2: #132555;
  --shadow: 0 6px 22px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
  --scene-top: #2a2f38; --scene-bottom: #15181d;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.4; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, canvas:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: 56px minmax(0, 1fr); }

/* ---------- header ---------- */
.topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-inline: 16px; background: linear-gradient(90deg, var(--header), var(--header-2)); color: var(--header-ink); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand b { font-family: var(--font-brand); font-weight: 800; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.machinebtn { display: flex; align-items: center; gap: 8px; min-width: 0; height: 34px; padding: 0 8px 0 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.07); color: inherit; cursor: pointer; font: inherit; }
.machinebtn:hover, .machinebtn[aria-expanded="true"] { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.4); }
.machinebtn .mn { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.machinebtn .mh { font-size: 12px; opacity: .75; white-space: nowrap; font-family: var(--font-data); }
.machinebtn svg { width: 16px; height: 16px; flex: none; opacity: .8; }
.machinepop { position: fixed; z-index: 60; width: min(380px, calc(100vw - 24px)); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; }
.machinepop h4 { margin: 8px 8px 6px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.machinepop .mitem { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 10px; align-items: center; width: 100%; text-align: left; border: 1px solid transparent; border-radius: 9px; background: transparent; padding: 8px 10px; cursor: pointer; color: inherit; font: inherit; }
.machinepop .mitem:hover { background: var(--panel-2); }
.machinepop .mitem[aria-checked="true"] { border-color: var(--primary); background: var(--primary-soft); }
.machinepop .mitem .ck { grid-row: 1 / span 2; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); }
.machinepop .mitem[aria-checked="true"] .ck { border-color: var(--primary); box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 8px var(--primary); }
.machinepop .mitem b { font-size: 14px; }
.machinepop .mitem small { grid-column: 2 / span 2; font-size: 12px; color: var(--muted); }
.machinepop .mitem .tag { font-family: var(--font-data); font-size: 11.5px; color: var(--muted); }
.machinepop .msep { height: 1px; background: var(--line); margin: 6px 4px; }
.stages { display: flex; gap: 4px; height: 56px; }
.stages button { position: relative; border: 0; background: none; color: rgba(255,255,255,.72); padding: 0 18px; font-size: 13.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.stages button .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; font-size: 11px; letter-spacing: 0; }
.stages button:hover { color: #fff; }
.stages button[aria-selected="true"] { color: #fff; }
.stages button[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: #fff; }
.top-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.themeseg { display: flex; padding: 3px; gap: 2px; border-radius: 9px; background: rgba(255,255,255,.12); }
.themeseg button { width: 34px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: rgba(255,255,255,.8); cursor: pointer; display: grid; place-items: center; }
.themeseg button[aria-pressed="true"] { background: #fff; color: var(--header); }
.themeseg svg { width: 17px; height: 17px; }
.iconbtn-h { height: 34px; padding: 0 12px; border: 1px solid rgba(255,255,255,.28); border-radius: 8px; background: transparent; color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.iconbtn-h:disabled { opacity: .4; cursor: default; }
.iconbtn-h svg { width: 16px; height: 16px; }

/* ---------- workspace ---------- */
.workspace { position: relative; min-height: 0; overflow: hidden; background: linear-gradient(var(--scene-top), var(--scene-bottom)); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#view.cur-move { cursor: move; } #view.cur-rotate { cursor: grab; } #view.cur-scale { cursor: nwse-resize; }
.float { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }

.hud { position: absolute; left: 84px; top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; max-width: calc(100% - 84px - 420px); }
.chip { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 13px; font-weight: 500; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); flex: none; }
.chip.out .dot { background: var(--warn); } .chip.na .dot { background: var(--faint); }
.chip.busy .dot { background: var(--primary); animation: pulse 1s infinite ease-in-out; }
@keyframes pulse { 50% { opacity: .3; } }
.workspace.tp-open .hud { left: 360px; max-width: calc(100% - 360px - 400px); }

/* left tool bar */
.tools { left: 14px; top: 14px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.tools button { width: 46px; height: 46px; border: 0; border-radius: 9px; background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; position: relative; }
.tools button:hover { background: var(--panel-2); }
.tools button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }
.tools button:disabled { opacity: .35; cursor: default; }
.tools svg { width: 24px; height: 24px; }
.tools .sep { height: 1px; background: var(--line); margin: 4px 6px; }
.tip { position: absolute; left: 54px; top: 50%; transform: translateY(-50%); white-space: nowrap; background: var(--ink); color: var(--panel); font-size: 12.5px; font-weight: 500; padding: 5px 9px; border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 5; }
.tools button:hover .tip, .tools button:focus-visible .tip { opacity: 1; }
.tip kbd { font-family: var(--font-data); font-size: 11px; opacity: .7; margin-left: 6px; }

/* tool popover (Cura-style, beside the tool bar) */
.toolpanel { left: 76px; top: 14px; width: 270px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.toolpanel h3 { margin: 0; font-size: 14.5px; font-weight: 600; }
.toolpanel .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* right settings panel */
.panel { right: 14px; top: 14px; bottom: 112px; width: 372px; display: flex; flex-direction: column; overflow: hidden; }
.panel-head { padding: 14px 18px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.panel-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.panel-head span { font-size: 12.5px; color: var(--muted); }
.panel-body { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; }
details.sec { border-bottom: 1px solid var(--line); }
details.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 0 18px; height: 46px; font-weight: 600; font-size: 14px; user-select: none; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary svg.ic { width: 19px; height: 19px; color: var(--primary); flex: none; }
details.sec > summary .chev { margin-left: auto; width: 16px; height: 16px; color: var(--faint); transition: transform .15s; }
details.sec[open] > summary .chev { transform: rotate(180deg); }
details.sec > summary .meta { font-weight: 400; font-size: 12.5px; color: var(--muted); margin-left: auto; }
details.sec > summary .meta + .chev { margin-left: 8px; }
.sec-body { padding: 2px 18px 16px; display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.5fr); align-items: center; gap: 12px; min-height: 34px; }
.row > label, .row > .lab { font-size: 13.5px; color: var(--ink); }
.row .ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row .ctl input[type=range] { flex: 1; min-width: 0; }
.row output, .val { font-family: var(--font-data); font-size: 12.5px; color: var(--muted); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; line-height: 1.5; }
.note.warn { color: var(--warn); } .note.err { color: var(--bad); }
input[type=range] { accent-color: var(--primary); }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--primary); }
.field { height: 34px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--panel); padding: 0 10px; min-width: 0; width: 100%; }
.field.num { width: 84px; font-family: var(--font-data); font-size: 13px; text-align: right; }
.field.big { font-size: 17px; height: 40px; }
.unit { position: relative; display: flex; align-items: center; }
.unit .field { padding-right: 30px; width: 100%; }
.unit i { position: absolute; right: 9px; font-style: normal; font-size: 12px; color: var(--faint); pointer-events: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; width: 100%; }
.seg button { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; border-radius: 6px; background: transparent; padding: 6px 4px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; }
.swooprow { display: block; }
.swooprow .lab { display: block; margin-bottom: 6px; }
.swoops { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.swoop { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 6px 2px 5px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--muted); font-size: 11px; cursor: pointer; }
.swoop svg { width: 40px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.swoop span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.swoop[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 1px var(--primary) inset; }
.swoop:disabled { opacity: .5; cursor: default; }
.seg button small { display: block; font-family: var(--font-data); font-size: 10.5px; opacity: .85; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.btn { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); font-weight: 600; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.big { height: 44px; font-size: 15px; padding: 0 20px; }
.btn.sm { height: 30px; font-size: 12.5px; padding: 0 10px; }
.btn svg { width: 17px; height: 17px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btnrow .btn { flex: 1 1 auto; }
.btnrow.four { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.btnrow.four .btn { padding: 0 6px; gap: 4px; }
.btnrow.four .btn svg { width: 14px; height: 14px; }

/* colour swatch buttons */
.swatchbtn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 6px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--panel); cursor: pointer; min-width: 0; width: 100%; }
.swatchbtn .sw { width: 22px; height: 22px; border-radius: 5px; border: 1px solid rgba(0,0,0,.2); flex: none; }
.swatchbtn .nm { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.swatchbtn .nm small { color: var(--muted); font-family: var(--font-data); }

/* layers list */
.layers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.layer { display: grid; grid-template-columns: 18px 26px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid transparent; border-radius: 8px; cursor: pointer; background: var(--panel-2); }
.layer:hover { border-color: var(--line-strong); }
.layer[aria-selected="true"] { background: var(--primary-soft); border-color: var(--primary); }
.layer.hiddenL .lname { opacity: .45; text-decoration: line-through; }
.layer .grip { color: var(--faint); cursor: grab; display: grid; place-items: center; }
.layer .grip svg { width: 14px; height: 14px; }
.layer .thumb { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); font-size: 15px; overflow: hidden; }
.layer .thumb img { width: 20px; height: 20px; }
.layer .lname { min-width: 0; }
.layer .lname b { display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer .lname span { display: flex; gap: 3px; align-items: center; font-size: 11.5px; color: var(--muted); }
.layer .lname span i { width: 9px; height: 9px; border-radius: 2px; border: 1px solid rgba(0,0,0,.25); }
.layer .ibtn { width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.layer .ibtn:hover { background: var(--panel); color: var(--ink); }
.layer .ibtn svg { width: 17px; height: 17px; }
.layer .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--primary); border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.layer.drop-before { box-shadow: 0 -3px 0 var(--primary); } .layer.drop-after { box-shadow: 0 3px 0 var(--primary); }
.addrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.addrow .btn { height: 38px; padding: 0 6px; font-size: 13px; }

/* font list */
.fontlist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.fontcard { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 6px 8px 5px; cursor: pointer; text-align: left; min-width: 0; }
.fontcard[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
.fontcard .smp { display: block; font-size: 22px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fontcard .fn { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* colourway themes */
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.theme { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 6px; cursor: pointer; text-align: left; min-width: 0; }
.theme[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.theme .strip { display: flex; height: 18px; border-radius: 4px; overflow: hidden; border: 1px solid rgba(0,0,0,.15); }
.theme .strip i { flex: 1; }
.theme .strip i.bands { display: flex; flex-direction: column; }
.theme .strip i.bands b { flex: 1; }
.flags { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
.flagcard { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 5px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.flagcard[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: var(--primary-soft); }
.flagcard .tn { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.fl { position: relative; display: block; height: 30px; border-radius: 3px; overflow: hidden; border: 1px solid rgba(0,0,0,.18); }
.fl.big { width: 64px; height: 40px; flex: none; }
.fstripes { position: absolute; inset: 0; display: flex; flex-direction: column; }
.fstripes i { flex: 1; }
.fchev { position: absolute; inset: 0; }
.fchev i { position: absolute; top: 0; bottom: 0; width: 60%; clip-path: polygon(0 0, 60% 50%, 0 100%); }
.fring { position: absolute; left: 50%; top: 50%; width: 46%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 3px solid; border-radius: 50%; }
.fl.big .fring { border-width: 4px; }
.fheart { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%); font-size: 18px; line-height: 1; text-shadow: 0 0 1px rgba(0,0,0,.4); }
.flaghead { display: flex; gap: 12px; align-items: center; padding-top: 4px; }
.flaghead b { display: block; font-size: 14px; }
.bakethumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.bakethumbs figure { margin: 0; }
.bakethumbs img { width: 100%; aspect-ratio: 1; display: block; border-radius: 5px; border: 1px solid var(--line); background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 12px 12px; }
.bakethumbs figcaption { font-size: 11px; color: var(--muted); text-align: center; margin-top: 2px; }
.autochip { flex: none; height: 24px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: var(--muted); font-size: 11.5px; font-weight: 600; cursor: pointer; }
.autochip[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.hint2 { display: block; font-size: 11.5px; color: var(--faint); }
.subh { margin: 14px 0 6px; font-size: 12px; font-weight: 600; color: var(--muted, var(--faint)); text-transform: uppercase; letter-spacing: .04em; }
select.field { padding: 0 6px; }
.row .ctl .seg { flex: 1; }
.reccard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.reccard .kv { font-size: 12.5px; }
.tnotes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; line-height: 1.45; }
.tnotes li { position: relative; padding-left: 16px; }
.tnotes li::before { content: ""; position: absolute; left: 2px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.tnotes li.warn::before { background: var(--warn); } .tnotes li.bad::before { background: var(--bad); }
.tnotes li.bad { color: var(--bad); }
.tgrid { max-height: 230px; overflow-y: auto; }
.tipbox { position: fixed; z-index: 80; max-width: 300px; padding: 10px 12px; border-radius: 9px; background: var(--panel); color: var(--ink); border: 1px solid var(--line-strong); box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.45; pointer-events: none; }
