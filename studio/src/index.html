/* Layout: slicer-style workbench. A navy header carries the Design / Stitch / Export stages; the 3D build plate fills the
   rest, with floating panels: tools on the left, the stage's settings on the right, the export summary bottom-right. */
:root {
  --bg: #e9edf2;
  --panel: #ffffff;
  --panel-2: #f4f6f9;
  --ink: #18202b;
  --muted: #5b6576;
  --faint: #8a93a3;
  --line: #d7dde6;
  --line-strong: #c3cbd7;
  --primary: #196ef0;
  --primary-ink: #ffffff;
  --primary-soft: #e3edfd;
  --good: #1d7a46;
  --warn: #b86a00;
  --bad: #c42b36;
  --header: #0e1c3f;
  --header-2: #16306a;
  --header-ink: #ffffff;
  --shadow: 0 6px 22px rgba(18, 32, 58, .14), 0 1px 3px rgba(18, 32, 58, .10);
  --scene-top: #f1f4f8;
  --scene-bottom: #d3dae4;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --font-brand: "Saira Extra Condensed", "Arial Narrow", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181e; --panel: #23272f; --panel-2: #1c2027; --ink: #e8ebf0; --muted: #a3acba; --faint: #7d8696;
    --line: #353b46; --line-strong: #454c59; --primary: #4a8dff; --primary-ink: #ffffff; --primary-soft: #1f3253;
    --good: #4cc38a; --warn: #f0a63c; --bad: #ff6b74; --header: #0b1430; --header-2: #132555;
    --shadow: 0 6px 22px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
    --scene-top: #2a2f38; --scene-bottom: #15181d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181e; --panel: #23272f; --panel-2: #1c2027; --ink: #e8ebf0; --muted: #a3acba; --faint: #7d8696;
  --line: #353b46; --line-strong: #454c59; --primary: #4a8dff; --primary-ink: #ffffff; --primary-soft: #1f3253;
  --good: #4cc38a; --warn: #f0a63c; --bad: #ff6b74; --header: #0b1430; --header-2: #132555;
  --shadow: 0 6px 22px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
  --scene-top: #2a2f38; --scene-bottom: #15181d;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.4; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, canvas:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: 56px minmax(0, 1fr); }

/* ---------- header ---------- */
.topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-inline: 16px; background: linear-gradient(90deg, var(--header), var(--header-2)); color: var(--header-ink); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 28px; height: 28px; flex: none; }
.topbar { position: relative; }
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--flag, none); pointer-events: none; }
.projbtn { display: flex; align-items: center; gap: 7px; min-width: 0; max-width: 220px; height: 34px; padding: 0 8px 0 10px; border-radius: 9px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.07); color: inherit; cursor: pointer; font: inherit; flex: 0 1 auto; }
.projbtn:hover, .projbtn[aria-expanded="true"] { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.4); }
.projbtn .pn { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.projbtn .pd { width: 8px; height: 8px; border-radius: 50%; background: #ffcf5c; flex: none; }
.projbtn svg { width: 16px; height: 16px; flex: none; opacity: .8; }
.projbtn svg.pi { opacity: .9; }
.palbtn { padding: 0 8px; }
.pswatch { display: block; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,.75); background: linear-gradient(135deg, #196ef0, #0e1c3f); }
.palpop { position: fixed; z-index: 60; width: min(340px, calc(100vw - 24px)); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.palpop h4, .projpop h4 { margin: 4px 4px 2px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.palgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.palgrid button { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; font-size: 13px; cursor: pointer; text-align: left; }
.palgrid button:hover { background: var(--panel-2); }
.palgrid button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); font-weight: 600; }
.palgrid i { width: 26px; height: 18px; border-radius: 4px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.palpop .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 3px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); }
.palpop .modes button { height: 30px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
.palpop .modes button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

/* ---------- workspace ---------- */
.workspace { position: relative; min-height: 0; overflow: hidden; background: linear-gradient(var(--scene-top), var(--scene-bottom)); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#view.cur-move { cursor: move; } #view.cur-rotate { cursor: grab; } #view.cur-scale { cursor: nwse-resize; }
.float { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }

.hud { position: absolute; left: 84px; top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; max-width: calc(100% - 84px - 420px); }
.chip { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 13px; font-weight: 500; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); flex: none; }
.chip.out .dot { background: var(--warn); } .chip.na .dot { background: var(--faint); }
.chip.busy .dot { background: var(--primary); animation: pulse 1s infinite ease-in-out; }
@keyframes pulse { 50% { opacity: .3; } }
.workspace.tp-open .hud { left: 360px; max-width: calc(100% - 360px - 400px); }

/* left tool bar */

/* right settings panel */

.fontcard[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }

.fontcard .fn { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* colourway themes */
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.theme { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 6px; cursor: pointer; text-align: left; min-width: 0; }
.theme[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.theme .strip { display: flex; height: 18px; border-radius: 4px; overflow: hidden; border: 1px solid rgba(0,0,0,.15); }
.theme .strip i { flex: 1; }
.theme .strip i.bands { display: flex; flex-direction: column; }
.theme .strip i.bands b { flex: 1; }
.flags { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
.flagcard { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 5px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.flagcard[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: var(--primary-soft); }
.flagcard .tn { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.fl { position: relative; display: block; height: 30px; border-radius: 3px; overflow: hidden; border: 1px solid rgba(0,0,0,.18); }
.fl.big { width: 64px; height: 40px; flex: none; }
.fstripes { position: absolute; inset: 0; display: flex; flex-direction: column; }
.fstripes i { flex: 1; }
.fchev { position: absolute; inset: 0; }
.fchev i { position: absolute; top: 0; bottom: 0; width: 60%; clip-path: polygon(0 0, 60% 50%, 0 100%); }
.fring { position: absolute; left: 50%; top: 50%; width: 46%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 3px solid; border-radius: 50%; }
.fl.big .fring { border-width: 4px; }
.fheart { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%); font-size: 18px; line-height: 1; text-shadow: 0 0 1px rgba(0,0,0,.4); }
.flaghead { display: flex; gap: 12px; align-items: center; padding-top: 4px; }
.flaghead b { display: block; font-size: 14px; }
.bakethumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.bakethumbs figure { margin: 0; }
.bakethumbs img { width: 100%; aspect-ratio: 1; display: block; border-radius: 5px; border: 1px solid var(--line); background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 12px 12px; }
.bakethumbs figcaption { font-size: 11px; color: var(--muted); text-align: center; margin-top: 2px; }
.autochip { flex: none; height: 24px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: var(--muted); font-size: 11.5px; font-weight: 600; cursor: pointer; }
.autochip[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.hint2 { display: block; font-size: 11.5px; color: var(--faint); }
.subh { margin: 14px 0 6px; font-size: 12px; font-weight: 600; color: var(--muted, var(--faint)); text-transform: uppercase; letter-spacing: .04em; }
select.field { padding: 0 6px; }
.row .ctl .seg { flex: 1; }
.reccard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.reccard .kv { font-size: 12.5px; }
.tnotes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; line-height: 1.45; }
.tnotes li { position: relative; padding-left: 16px; }
.tnotes li::before { content: ""; position: absolute; left: 2px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.tnotes li.warn::before { background: var(--warn); } .tnotes li.bad::before { background: var(--bad); }
.tnotes li.bad { color: var(--bad); }
.tgrid { max-height: 230px; overflow-y: auto; }
.tipbox { position: fixed; z-index: 80; max-width: 300px; padding: 10px 12px; border-radius: 9px; background: var(--panel); color: var(--ink); border: 1px solid var(--line-strong); box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.45; pointer-events: none; }
.tipbox b { font-weight: 600; } .tipbox .tt { display: block; font-weight: 600; font-size: 13px; margin-bottom: 3px; } .tipbox span { color: var(--muted); }
.dirlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.dirlist li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto 28px; gap: 8px; align-items: center; font-size: 13px; }
.dirlist .sw { width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgba(0,0,0,.2); }
.dirlist .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dirlist .ibtn { width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; }
.dirlist .ibtn:hover { background: var(--panel-2); color: var(--ink); }
#view.cur-dir { cursor: crosshair; }
.bandrow { display: flex; flex-wrap: wrap; gap: 5px; }
.bandsw { width: 36px; height: 30px; border-radius: 6px; border: 1px solid rgba(0,0,0,.25); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); cursor: pointer; padding: 0; }
.bandsw:hover { outline: 2px solid var(--primary); outline-offset: 1px; }
.bandsw:disabled { cursor: default; opacity: .6; }
.theme .tn { display: block; font-size: 11.5px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* colour sequence (export) */
.seqlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; counter-reset: s; }
.seqlist li { display: grid; grid-template-columns: 20px 24px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.seqlist li::before { counter-increment: s; content: counter(s); font-family: var(--font-data); font-size: 12px; color: var(--muted); text-align: right; }
.seqlist .sw { width: 24px; height: 24px; border-radius: 5px; border: 1px solid rgba(0,0,0,.2); }
.seqlist b { font-weight: 600; } .seqlist small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seqlist .ct { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 0; font-size: 13.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--font-data); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.fps { font-family: var(--font-brand); font-weight: 800; font-size: 46px; line-height: .9; font-variant-numeric: tabular-nums; }
.fps small { font-family: var(--font-ui); font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }

/* bottom-right action panel */
.action { right: 14px; bottom: 14px; width: 372px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.action .est { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.action .est b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.action .est span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* camera views, bottom-left */
.viewbar { left: 14px; bottom: 14px; padding: 4px; display: flex; gap: 2px; align-items: center; }
.viewbar button { width: 38px; height: 36px; border: 0; border-radius: 7px; background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.viewbar button:hover { background: var(--panel-2); }
.viewbar button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }
.viewbar .vsep { width: 1px; height: 22px; background: var(--line); margin: 0 3px; }
.viewbar svg { width: 21px; height: 21px; }

/* stitch-out playback (Stitch stage) */
.playbar { left: 50%; transform: translateX(-50%); bottom: 14px; width: min(520px, calc(100% - 860px)); min-width: 300px; padding: 8px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.playbar input { width: 100%; }
.playbar .val { min-width: 120px; }

/* modal (emoji picker) */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 28, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { width: min(720px, 100%); max-height: min(82vh, 760px); display: flex; flex-direction: column; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.modal header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal header h2 { margin: 0; font-size: 17px; }
.modal .mbody { overflow-y: auto; padding: 8px 18px 18px; }
.modal h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 8px; font-weight: 600; }
.egrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.egrid button { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); cursor: pointer; display: grid; place-items: center; padding: 6px; }
.egrid button:hover { border-color: var(--primary); background: var(--primary-soft); }
.egrid img { width: 100%; height: 100%; }
.credit { font-size: 12px; color: var(--muted); padding: 10px 18px; border-top: 1px solid var(--line); }
.emodal { width: min(860px, 100%); height: min(86vh, 820px); max-height: none; }
.emodal .mbody { flex: 1; min-height: 0; }
.etools { display: flex; gap: 10px; align-items: center; padding: 12px 18px 6px; flex-wrap: wrap; }
.etools input { flex: 1 1 220px; min-width: 0; }
.etones { display: flex; gap: 4px; }
.etones button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); display: grid; place-items: center; cursor: pointer; padding: 0; }
.etones button i { width: 16px; height: 16px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.etones button[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: var(--primary-soft); }
.etabs { display: flex; gap: 4px; padding: 4px 18px 8px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.etabs button { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; border: 1px solid transparent; border-radius: 8px; background: transparent; padding: 5px 8px; cursor: pointer; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.etabs button img { width: 22px; height: 22px; }
.etabs button[aria-selected="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--ink); }
@media (max-width: 700px) { .etabs button span { display: none; } }
.fkinds { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 6px; }
.fkinds button { border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2); padding: 4px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.fkinds button small { opacity: .7; font-size: 11px; }
.fkinds button[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

/* thread picker popover */
.threadpop { position: fixed; z-index: 60; width: 300px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.tgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.tgrid button { aspect-ratio: 1; border: 1px solid rgba(0,0,0,.18); border-radius: 4px; cursor: pointer; padding: 0; }
.tgrid button[aria-pressed="true"] { outline: 2px solid var(--primary); outline-offset: 1px; }

.pie { position: absolute; width: 0; height: 0; z-index: 35; }
.pie-disc { position: absolute; left: calc(var(--r) * -1); top: calc(var(--r) * -0.7); width: calc(var(--r) * 2); height: calc(var(--r) * 1.4); border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--panel) 62%, transparent) 0%, color-mix(in srgb, var(--panel) 40%, transparent) 55%, transparent 100%);
  opacity: 0; transform: scale(.6); transition: opacity .18s ease, transform .22s cubic-bezier(.3, 1.4, .6, 1); }
.pie.open .pie-disc { opacity: 1; transform: none; }
.pie-hub { position: absolute; z-index: 2; left: -25px; top: -25px; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--header-ink);
  border: 3px solid var(--panel); background: var(--header); box-shadow: 0 0 0 2px var(--primary), var(--shadow); padding: 0; overflow: hidden;
  transform: scale(.3); opacity: 0; transition: transform .2s cubic-bezier(.3, 1.6, .6, 1), opacity .12s; }
.pie.open .pie-hub { transform: none; opacity: 1; }
.pie-hub .sw { position: absolute; inset: 0; border-radius: 50%; }
.pie-hub .ic { position: relative; width: 20px; height: 20px; stroke-width: 2.4; filter: drop-shadow(0 0 2px rgba(0, 0, 0, .55)); color: #fff; }
.pie-hub:hover, .pie-hub:focus-visible { box-shadow: 0 0 0 4px var(--primary), var(--shadow); outline: none; }
.pie-title { position: absolute; left: 0; top: var(--ty); transform: translate(-50%, -50%) scale(.8); opacity: 0; transition: opacity .15s .05s, transform .2s .05s; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; white-space: nowrap; padding: 6px 14px; border-radius: 12px; background: var(--header); color: var(--header-ink); box-shadow: var(--shadow); }
.pie.open .pie-title { opacity: 1; transform: translate(-50%, -50%); }
.pie-title b { font-size: 14px; font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.pie-title span { font-size: 11.5px; opacity: .8; }
.pie-item { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 7px; white-space: nowrap; cursor: pointer;
  font: 600 13px/1 var(--font-ui); color: var(--ink); background: var(--panel); border: 1.5px solid var(--line-strong); border-radius: 999px; padding: 6px 13px 6px 6px;
  box-shadow: var(--shadow); opacity: 0; transform: translate(-50%, -50%) scale(.3);
  transition: transform .24s cubic-bezier(.3, 1.45, .55, 1) var(--d), opacity .14s var(--d), background .1s, color .1s, border-color .1s; }
.pie.open .pie-item { opacity: 1; transform: translate(calc(var(--ax) + var(--x)), calc(-50% + var(--y))); }
.pie-item.left { flex-direction: row-reverse; padding: 6px 6px 6px 13px; }
.pie.closing .pie-item, .pie.closing .pie-hub, .pie.closing .pie-title, .pie.closing .pie-disc { transition-duration: .12s; transition-delay: 0s; opacity: 0; }
.pie-item .pi, .pie-item .sw { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
.pie-item .sw { box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .18); }
.pie-item .pi .ic { width: 16px; height: 16px; }
.pie-item .pl i { font-style: normal; margin-left: 4px; opacity: .55; }
.pie-item kbd { font: 500 10px/1 var(--font-data); color: var(--faint); margin-left: 2px; }
.pie-item:hover, .pie-item:focus-visible { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); outline: none; }
.pie.open .pie-item:hover, .pie.open .pie-item:focus-visible { transform: translate(calc(var(--ax) + var(--x)), calc(-50% + var(--y))) scale(1.06); transition-delay: 0s; }
.pie-item:hover .pi, .pie-item:focus-visible .pi { background: rgba(255, 255, 255, .22); color: inherit; }
.pie-item:hover kbd, .pie-item:focus-visible kbd { color: inherit; opacity: .7; }
.pie-item.on { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft), var(--shadow); }
.pie-item.on .pl::after { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); margin-left: 6px; vertical-align: middle; }
.pie-item.on:hover .pl::after, .pie-item.on:focus-visible .pl::after { background: currentColor; }
.pie-item.danger:hover, .pie-item.danger:focus-visible { background: var(--bad); border-color: var(--bad); }
.pie-item.danger .pi { color: var(--bad); }
.pie-item[disabled] { opacity: .45 !important; cursor: default; box-shadow: none; }
.pie-item[disabled]:hover { background: var(--panel); color: var(--ink); border-color: var(--line-strong); }
@media (prefers-reduced-motion: reduce) { .pie *, .pie-item { transition-duration: .01s !important; transition-delay: 0s !important; } }
.areabadge { font: 600 10.5px/1 var(--font-ui); padding: 3px 6px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); margin-left: auto; white-space: nowrap; }
.areabadge.off { background: var(--panel-2); color: var(--muted); }
.swatchbtn.skipped .sw { background-image: repeating-linear-gradient(45deg, transparent 0 3px, rgba(255, 255, 255, .7) 3px 5px) !important; }
.designpop { position: fixed; z-index: 60; width: min(460px, calc(100vw - 24px)); max-height: min(560px, calc(100vh - 80px)); display: flex; flex-direction: column; gap: 8px; padding: 14px; }
.designlist { overflow: auto; display: grid; gap: 6px; padding-right: 2px; }
.designrow { display: flex; align-items: center; gap: 12px; text-align: left; padding: 6px 10px 6px 6px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel); color: var(--ink); cursor: pointer; font: inherit; }
.designrow img { width: 52px; height: 52px; border-radius: 7px; background: var(--panel-2); flex: none; }
.designrow span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.designrow:hover, .designrow:focus-visible { border-color: var(--primary); outline: none; background: var(--primary-soft); }

.blocklist { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 5px; }
.blockrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 32px; align-items: center; gap: 6px; }

.toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--panel); font-weight: 500; box-shadow: var(--shadow); z-index: 40; max-width: min(560px, calc(100% - 32px)); }
.drophint { position: absolute; inset: 12px; border: 3px dashed var(--primary); border-radius: 16px; background: color-mix(in srgb, var(--primary) 10%, transparent); display: grid; place-items: center; font-size: 20px; font-weight: 600; color: var(--primary); pointer-events: none; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 64px; font-size: 12px; color: var(--muted); pointer-events: none; white-space: nowrap; }

  .viewbar { top: calc(56vh - 56px); bottom: auto; left: 10px; }
